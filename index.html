<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>打卡小助手</title>
  <style>
    :root {
      color-scheme: light;
      --background: #fdf8f1;
      --surface: #fffdf9;
      --surface-muted: #faf4ec;
      --line: #f0e8dc;
      --text: #4b453f;
      --muted: #a99f95;
      --accent: #a9d9a2;
      --accent-soft: #edf7ea;
      --accent-dark: #63945d;
      --secondary: #f4aeb8;
      --secondary-soft: #fdeef1;
      --secondary-dark: #c9778a;
      --rest: #d97f62;
      --rest-soft: #fdeae3;
      --radius: 18px;
      --shadow: 0 2px 10px rgba(205, 170, 150, .1), 0 1px 3px rgba(205, 170, 150, .05);
      --serif: Georgia, "Times New Roman", "Songti SC", serif;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0 auto; max-width: 680px; min-height: 100dvh; padding: 12px 12px 18px; background: linear-gradient(180deg, var(--background) 0%, #f9f1e9 100%); color: var(--text); }
    main { display: grid; gap: 10px; }
    section { padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
    .hero { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .hero h1 { font: 700 19px/1.1 var(--serif); letter-spacing: .04em; margin: 0; color: var(--secondary-dark); }
    .hero p { margin: 2px 0 0; font-size: 10px; color: var(--muted); letter-spacing: .12em; }
    .hero-mark { width: 34px; height: 34px; display: grid; place-items: center; border: 2px solid var(--secondary); border-radius: 50%; background: var(--surface); color: var(--accent-dark); font: 800 14px/1 var(--serif); box-shadow: var(--shadow); }
    h2 { font: 700 15px/1.2 var(--serif); display: flex; align-items: center; gap: 8px; margin: 0 0 8px; color: var(--secondary-dark); }
    h2::before { content: ""; width: 4px; height: 18px; border-radius: 2px; background: linear-gradient(180deg, var(--accent), var(--secondary)); }
    label { display: block; margin: 0 4px 3px; font-size: 11px; font-weight: 550; color: var(--muted); }
    input, select { width: 100%; min-height: 36px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 15px; }
    input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button { min-height: 34px; padding: 6px 11px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--muted); font-size: 12px; font-weight: 600; transition: transform .15s ease, box-shadow .15s ease, color .15s ease, border-color .15s ease; }
    button:hover { border-color: var(--accent); color: var(--accent-dark); }
    button:active { transform: scale(.98); }
    .secondary { color: var(--accent-dark); }
    .danger { color: var(--rest); }
    .danger:hover { border-color: var(--rest); background: var(--rest-soft); color: #a55f43; }
    .calendar-head, .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .calendar-head { margin: 8px 0 4px; }
    .calendar-head div { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); }
    .calendar-head div.weekend { color: var(--secondary-dark); }
    .day { min-height: 46px; padding: 4px 2px; border: 1px solid transparent; border-radius: 9px; background: var(--surface-muted); text-align: center; font-size: 9px; line-height: 1.15; user-select: none; transition: transform .12s ease, box-shadow .12s ease, background .12s ease; }
    .day:hover { filter: brightness(.98); }
    .day:active { transform: scale(.96); }
    .day.weekend { background: #fdeef1; }
    .day.rest { background: #fdeae3; border-color: #f3d8cb; }
    .day.holiday { background: #eaf6e6; border-color: #d8ecd1; }
    .day.makeup { background: #fdf5df; border-color: #f3e2b8; }
    .day.rest.holiday { background: #d6f0cf; }
    .day.rest.makeup { background: #fbe6c8; }
    .day .date { font: 700 14px/1.15 var(--serif); }
    .day .holiday-name { overflow: hidden; max-width: 100%; font-size: 9px; color: #78806b; text-overflow: ellipsis; white-space: nowrap; }
    .day .mode { margin-top: 2px; padding: 1px 5px; display: inline-block; border-radius: 999px; font-size: 9px; font-weight: 750; }
    .day .mode.work { background: var(--accent-soft); color: var(--accent-dark); }
    .day .mode.rest { background: #fbd9dd; color: #9c4f5d; }
    .row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .row button { flex: 1 1 100px; margin-top: 0; }
    .summary { font-size: 13px; color: var(--muted); }
    .status { min-height: 15px; margin-top: 4px; font-size: 11px; color: var(--accent-dark); }
    .status.error { color: #b4232a; }
    .month-row { display: grid; grid-template-columns: 38px 1fr 38px; gap: 5px; align-items: end; }
    .month-row button { min-height: 36px; padding: 0; font-size: 17px; line-height: 1; }
    .settings-grid { display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 8px; align-items: end; }
    .summary-list { display: grid; gap: 5px; max-height: 205px; overflow-y: auto; scrollbar-width: none; }
    .summary-list::-webkit-scrollbar { display: none; }
    .summary-card { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface-muted); font-size: 12px; }
    .summary-card .month { font: 700 13px/1 var(--serif); color: #5b544c; }
    .summary-card .numbers { display: flex; gap: 4px; }
    .summary-card .pill { min-width: 52px; padding: 2px 7px; border-radius: 999px; text-align: center; font-size: 10px; font-weight: 750; }
    .summary-card .pill.rest { background: var(--rest-soft); color: #a55f43; }
    .summary-card .pill.work { background: var(--accent-soft); color: var(--accent-dark); }
    .summary-card .pill.salary { background: var(--secondary-soft); color: var(--secondary-dark); }
    .pagination { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 7px; font-size: 11px; color: var(--muted); }
    .pagination .pages { display: flex; align-items: center; gap: 4px; }
    .pagination button { min-height: 28px; padding: 4px 9px; font-size: 11px; border-radius: 14px; }
    .pagination button.active { background: var(--secondary-soft); border-color: var(--secondary); color: var(--secondary-dark); font-weight: 750; }
    .pagination button:disabled { opacity: .42; pointer-events: none; }
    .page-size-group { display: inline-flex; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-muted); }
    .page-size-group button { min-height: 24px; padding: 3px 8px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font-size: 10px; font-weight: 700; }
    .page-size-group button.active { background: var(--secondary); color: #fff; }
  </style>
</head>
<body>
<main>
  <section>
    <div class="hero">
      <div><h1>打卡小助手</h1><p>DAILY CHECK-IN</p></div>
      <div class="hero-mark">记</div>
    </div>
    <div class="settings-grid">
      <div>
        <label for="month">月份</label>
        <div class="month-row">
          <button id="prev-month" type="button" class="secondary" aria-label="上一月">‹</button>
          <input id="month" type="month">
          <button id="next-month" type="button" class="secondary" aria-label="下一月">›</button>
        </div>
      </div>
      <div>
        <label for="rate">每日单价</label>
        <input id="rate" type="number" min="0" step="0.01" inputmode="decimal" placeholder="300">
      </div>
    </div>
    <div id="message" class="status" aria-live="polite"></div>
  </section>

  <section>
    <h2>当月记录</h2>
    <div class="calendar-head">
      <div>周一</div><div>周二</div><div>周三</div><div>周四</div><div>周五</div><div class="weekend">周六</div><div class="weekend">周日</div>
    </div>
    <div id="days" class="days"></div>
    <div class="row">
      <button id="invert" type="button" class="secondary">反选休息日</button>
      <button id="clear" type="button" class="danger">清空当月记录</button>
    </div>
  </section>

  <section>
    <h2>全部汇总</h2>
    <div id="all-summary" class="summary-list"></div>
    <div id="summary-pagination" class="pagination"></div>
  </section>

</main>

<script>
(() => {
  const monthInput = document.querySelector("#month");
  const daysBox = document.querySelector("#days");
  const messageBox = document.querySelector("#message");
  const allSummary = document.querySelector("#all-summary");
  const rateInput = document.querySelector("#rate");
  const fileInput = document.querySelector("#file");
  const state = defaultState();
  const isServerMode = location.protocol === "http:";
  const storageKey = "daily-check-in-data-v1";
  const sharedRecordId = "ff808181a09d98f701a0c72aefa167b9";
  const sharedMode = !isServerMode;
  let holidays = {};
  let summaryPage = 1;
  let summaryPageSize = 5;

  function todayValue() {
    return new Date().toISOString().slice(0, 7);
  }

  function defaultState() {
    return { month: todayValue(), rate: 300, rates: {}, restDays: {} };
  }

  function loadSavedState(saved) {
    if (!saved || typeof saved !== "object") return defaultState();
    const restDays = {};
    for (const [key, value] of Object.entries(saved.days || saved.restDays || {})) {
      if (value === true || value === "rest") restDays[key] = true;
    }
    const rate = Number(saved.rate);
    const rates = { ...(saved.rates || {}) };
    if (Number.isFinite(rate) && rate >= 0 && rates[saved.month] === undefined) rates[saved.month] = rate;
    const month = todayValue();
    return { month, rate: Number.isFinite(rates[month]) ? rates[month] : 300, rates, restDays };
  }

  async function loadState() {
    if (sharedMode) {
      const response = await fetch(`https://api.restful-api.dev/objects/${sharedRecordId}`, { cache: "no-store" });
      if (!response.ok) throw new Error("load failed");
      const payload = await response.json();
      return loadSavedState(payload.data);
    }
    if (!isServerMode) return loadSavedState(JSON.parse(localStorage.getItem(storageKey) || "null"));
    const response = await fetch("/data");
    if (!response.ok) throw new Error("load failed");
    return loadSavedState(await response.json());
  }

  async function saveState(showMessage = false) {
    state.month = monthInput.value || todayValue();
    state.rate = Number(rateInput.value) || 0;
    state.rates = { ...(state.rates || {}), [state.month]: state.rate };
    if (sharedMode) {
      const response = await fetch(`https://api.restful-api.dev/objects/${sharedRecordId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: "daily-check-in", data: state })
      });
      if (!response.ok) throw new Error("save failed");
      if (showMessage) setMessage("已保存到共享记录");
      return;
    }
    if (!isServerMode) {
      localStorage.setItem(storageKey, JSON.stringify(state));
      if (showMessage) setMessage("已保存到本设备");
      return;
    }
    const response = await fetch("/data", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(state) });
    if (!response.ok) throw new Error("save failed");
    if (showMessage) setMessage("已保存到本机");
  }

  function setMessage(text, isError = false) {
    messageBox.textContent = text;
    messageBox.classList.toggle("error", isError);
  }

  function monthDays(yearMonth) {
    const [year, month] = yearMonth.split("-").map(Number);
    return new Date(year, month, 0).getDate();
  }

  function getRate(yearMonth) {
    const rate = Number(state.rates?.[yearMonth]);
    return Number.isFinite(rate) ? rate : 300;
  }

  function shiftMonth(delta) {
    const [year, month] = monthInput.value.split("-").map(Number);
    const target = new Date(year, month - 1 + delta, 1);
    monthInput.value = `${target.getFullYear()}-${String(target.getMonth() + 1).padStart(2, "0")}`;
    applyMonth();
  }

  function applyMonth() {
    state.month = monthInput.value;
    rateInput.value = getRate(state.month);
    saveState().catch(() => setMessage("保存失败", true));
    loadHolidays(state.month.slice(0, 4)).then((data) => {
      holidays = data || {};
      render();
    });
  }

  async function loadHolidays(year) {
    try {
      const response = await fetch(`https://raw.githubusercontent.com/NateScarlet/holiday-cn/master/${year}.json`, { cache: "force-cache" });
      if (!response.ok) return {};
      const payload = await response.json();
      return Object.fromEntries(payload.days.map((item) => [item.date, { isOffDay: item.isOffDay, name: item.name }]));
    } catch {
      return {};
    }
  }

  function render() {
    const yearMonth = monthInput.value;
    const count = monthDays(yearMonth);
    const firstWeekday = (new Date(`${yearMonth}-01T00:00:00`).getDay() + 6) % 7;
    daysBox.replaceChildren();
    for (let index = 0; index < firstWeekday; index++) daysBox.append(document.createElement("div"));
    let restCount = 0;

    for (let date = 1; date <= count; date++) {
      const key = `${yearMonth}-${String(date).padStart(2, "0")}`;
      const holiday = holidays[key];
      const isRest = Boolean(state.restDays[key]);
      if (isRest) restCount += 1;
      const weekday = new Date(`${key}T00:00:00`).getDay();
      const isWeekend = weekday === 0 || weekday === 6;
      const day = document.createElement("div");
      day.className = ["day", isWeekend ? "weekend" : "", holiday?.isOffDay ? "holiday" : "", holiday && !holiday.isOffDay ? "makeup" : "", isRest ? "rest" : ""].filter(Boolean).join(" ");
      day.textContent = "";
      const dateText = document.createElement("div");
      dateText.className = "date";
      dateText.textContent = date;
      const modeText = document.createElement("div");
      modeText.className = isRest ? "mode rest" : "mode work";
      modeText.textContent = isRest ? "休息" : "上班";
      day.append(dateText, modeText);
      if (holiday) {
        const holidayText = document.createElement("div");
        holidayText.className = "holiday-name";
        holidayText.textContent = holiday.isOffDay ? holiday.name : `${holiday.name}·班`;
        day.append(holidayText);
      }
      day.addEventListener("click", () => {
        if (state.restDays[key]) delete state.restDays[key];
        else state.restDays[key] = true;
        saveState().then(render).catch(() => setMessage("保存失败", true));
      });
      daysBox.append(day);
    }

    renderAllSummary();
  }

  function renderAllSummary() {
    const months = [...new Set(Object.keys(state.restDays).map((key) => key.slice(0, 7)))].sort();
    const totalPages = Math.max(1, Math.ceil(months.length / summaryPageSize));
    summaryPage = Math.min(summaryPage, totalPages);
    const visibleMonths = months.slice((summaryPage - 1) * summaryPageSize, summaryPage * summaryPageSize);
    allSummary.replaceChildren();
    if (months.length === 0) {
      const empty = document.createElement("div");
      empty.className = "summary-card";
      const monthText = document.createElement("span");
      monthText.className = "month";
      monthText.textContent = "暂无记录";
      empty.append(monthText);
      allSummary.append(empty);
    }
    for (const month of visibleMonths) {
      const restCount = Object.keys(state.restDays).filter((key) => key.startsWith(`${month}-`)).length;
      const workCount = monthDays(month) - restCount;
      const salary = (workCount * getRate(month)).toFixed(2);
      const card = document.createElement("div");
      card.className = "summary-card";
      const monthText = document.createElement("span");
      monthText.className = "month";
      monthText.textContent = `${month}月`;
      const numbers = document.createElement("span");
      numbers.className = "numbers";
      const restPill = document.createElement("span");
      restPill.className = "pill rest";
      restPill.textContent = `休息 ${restCount}天`;
      const workPill = document.createElement("span");
      workPill.className = "pill work";
      workPill.textContent = `工作 ${workCount}天`;
      const salaryPill = document.createElement("span");
      salaryPill.className = "pill salary";
      salaryPill.textContent = `¥${salary}`;
      numbers.append(restPill, workPill, salaryPill);
      card.append(monthText, numbers);
      allSummary.append(card);
    }
    renderPagination(months.length, totalPages);
  }

  function renderPagination(totalCount, totalPages) {
    const pagination = document.querySelector("#summary-pagination");
    pagination.replaceChildren();
    const info = document.createElement("div");
    info.className = "page-settings";
    const sizeLabel = document.createElement("span");
    sizeLabel.textContent = "每页";
    const sizeGroup = document.createElement("div");
    sizeGroup.className = "page-size-group";
    for (const size of [5, 10, 15, 20, 50, 100]) {
      const sizeButton = document.createElement("button");
      sizeButton.textContent = size;
      sizeButton.className = size === summaryPageSize ? "active" : "";
      sizeButton.addEventListener("click", () => {
        summaryPageSize = size;
        summaryPage = 1;
        renderAllSummary();
      });
      sizeGroup.append(sizeButton);
    }
    const total = document.createElement("span");
    total.textContent = `共 ${totalCount} 条`;
    info.append(sizeLabel, sizeGroup, total);
    const pages = document.createElement("div");
    pages.className = "pages";
    const previous = document.createElement("button");
    previous.textContent = "上一页";
    previous.disabled = summaryPage === 1;
    previous.addEventListener("click", () => { summaryPage -= 1; renderAllSummary(); });
    pages.append(previous);
    const pageNumbers = [...new Set([1, summaryPage - 1, summaryPage, summaryPage + 1, totalPages].filter((page) => page >= 1 && page <= totalPages))].sort((a, b) => a - b);
    for (const pageNumber of pageNumbers) {
      const pageButton = document.createElement("button");
      pageButton.textContent = pageNumber;
      pageButton.className = pageNumber === summaryPage ? "active" : "";
      pageButton.addEventListener("click", () => { summaryPage = pageNumber; renderAllSummary(); });
      pages.append(pageButton);
    }
    const next = document.createElement("button");
    next.textContent = "下一页";
    next.disabled = summaryPage === totalPages;
    next.addEventListener("click", () => { summaryPage += 1; renderAllSummary(); });
    pages.append(next);
    pagination.append(info, pages);
  }

  function exportData() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `ayi-pay-${state.month}.json`;
    link.click();
    URL.revokeObjectURL(link.href);
    setMessage("备份已下载，可在其他设备导入");
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imported = JSON.parse(String(reader.result));
        if (!imported || typeof imported !== "object" || typeof (imported.days || imported.restDays) !== "object") {
          throw new Error("invalid");
        }
        Object.assign(state, loadSavedState(imported));
        saveState();
        monthInput.value = state.month;
        setMessage("导入成功");
        render();
      } catch {
        setMessage("备份文件无效", true);
      } finally {
        fileInput.value = "";
      }
    };
    reader.readAsText(file);
  }

  document.querySelector("#invert").addEventListener("click", () => {
    const yearMonth = monthInput.value;
    for (let date = 1; date <= monthDays(yearMonth); date++) {
      const key = `${yearMonth}-${String(date).padStart(2, "0")}`;
      if (state.restDays[key]) delete state.restDays[key];
      else state.restDays[key] = true;
    }
    saveState().then(render).catch(() => setMessage("保存失败", true));
  });
  document.querySelector("#clear").addEventListener("click", () => {
    if (!confirm(`清空 ${monthInput.value} 的打卡记录？`)) return;
    for (const key of Object.keys(state.restDays)) {
      if (key.startsWith(`${monthInput.value}-`)) delete state.restDays[key];
    }
    saveState();
    render();
  });
  document.querySelector("#prev-month").addEventListener("click", () => shiftMonth(-1));
  document.querySelector("#next-month").addEventListener("click", () => shiftMonth(1));
  monthInput.addEventListener("change", applyMonth);
  rateInput.addEventListener("change", () => saveState().then(render).catch(() => setMessage("保存失败", true)));

  loadState().then((loaded) => {
    Object.assign(state, loaded);
    state.month = todayValue();
    monthInput.value = state.month;
    rateInput.value = getRate(state.month);
    render();
  }).catch(() => {
    state.month = todayValue();
    monthInput.value = todayValue();
    rateInput.value = getRate(state.month);
    render();
    setMessage("无法读取历史数据", true);
  }).finally(() => {
    loadHolidays(monthInput.value.slice(0, 4)).then((data) => {
      holidays = data || {};
      render();
    });
  });
})();
</script>
</body>
</html>
